[project]
name = "crmbuilder"
version = "0.1.0"
description = "Bitrix24 portal configuration as code: import, plan, apply, rollback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "certifi",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
crmbuilder = "crmbuilder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crmbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
