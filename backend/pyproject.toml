[project]
name = "crmbuilder-web"
version = "0.1.0"
description = "Web API for crmbuilder: projects, import, plan."
requires-python = ">=3.11"
dependencies = [
    "crmbuilder",
    "alembic>=1.13",
    "cryptography>=43",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
crmbuilder-web = "crmbuilder_web.main:run"

[tool.uv.sources]
crmbuilder = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crmbuilder_web"]
